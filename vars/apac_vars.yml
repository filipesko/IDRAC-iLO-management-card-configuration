---
# APAC regional configuration. Encrypt this file with Ansible Vault.
bmc_password: "CHANGE-ME-USE-ANSIBLE-VAULT"
bmc_validate_certs: false
bmc_no_log: true
bmc_timezone: "Asia/Singapore"

domain_name: "apac.example.com"
ilo_dns_servers: ["203.0.113.53", "203.0.113.54"]
ilo_ntp_servers: ["ntp1.apac.example.com", "ntp2.apac.example.com"]
ilo_snmp_trap_destination: "203.0.113.60"
ilo_snmp_trap_community: "CHANGE-ME-USE-ANSIBLE-VAULT"
ilo_ethernet_interface_uri: ""
ilo_no_log: true

idrac_dns_servers: ["203.0.113.53", "203.0.113.54"]
idrac_ntp_servers: ["ntp1.apac.example.com", "ntp2.apac.example.com"]
idrac_snmp_trap_destination: "203.0.113.60"
idrac_snmp_trap_community: "CHANGE-ME-USE-ANSIBLE-VAULT"
idrac_snmp_destination_index: 1
idrac_timeout: 60
idrac_no_log: true
